services:
  web:
    build: .
    container_name: comicvault_web
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:?Set a generated SECRET_KEY in .env before starting}
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - DATABASE_URL=sqlite:////app/instance/comics.db
    volumes:
      - comic_data:/app/instance
      - comic_uploads:/app/static/uploads
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  comic_data:
  comic_uploads:
