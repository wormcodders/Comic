{% extends "admin/base.html" %}

{% block title %}Add Tag - Admin - ComicVault{% endblock %}

{% block admin_content %}
<div class="admin-header">
    <div class="d-flex justify-content-between align-items-center">
        <h1><i class="fas fa-plus me-2"></i>Add Tag</h1>
        <a href="{{ url_for('main.admin_tags') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i>Back
        </a>
    </div>
</div>

<div class="admin-table">
    <div class="admin-table-header">
        <h3 class="admin-table-title">New Tag</h3>
    </div>
    <div class="p-4">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label class="form-label">Tag Name</label>
                <input type="text" class="form-control" name="tag" required placeholder="e.g., action, mystery, sci-fi">
                <div class="form-text">Enter the tag name (without the '#' symbol).</div>
            </div>
            
            <hr class="my-4">
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>Save Tag
                </button>
                <a href="{{ url_for('main.admin_tags') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
