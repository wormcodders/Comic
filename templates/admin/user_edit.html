{% extends "admin/base.html" %}

{% block title %}Edit User - Admin - ComicVault{% endblock %}

{% block admin_content %}
<div class="admin-header">
    <div class="d-flex justify-content-between align-items-center">
        <h1><i class="fas fa-user-edit me-2"></i>Edit User</h1>
        <a href="{{ url_for('main.admin_users') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i>Back to Users
        </a>
    </div>
</div>

<div class="admin-table">
    <div class="admin-table-header">
        <h3 class="admin-table-title">User: {{ user.username }}</h3>
    </div>
    <div class="p-4">
        <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" value="{{ user.username }}" disabled>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" value="{{ user.email }}" disabled>
                </div>
            </div>
            
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="is_admin" name="is_admin" 
                           {% if user.is_admin %}checked{% endif %}>
                    <label class="form-check-label" for="is_admin">
                        <strong>Admin Privileges</strong>
                    </label>
                </div>
                <div class="form-text">Grant admin access to this user</div>
            </div>
            
            <hr class="my-4">
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>Save Changes
                </button>
                <a href="{{ url_for('main.admin_users') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
